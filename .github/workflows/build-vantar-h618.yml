name: Build Armbian Vontar H618

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 600

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Cache Armbian
      uses: actions/cache@v4
      with:
        path: |
          cache
          output/cache
        key: armbian-cache

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          git curl wget zip unzip \
          build-essential bc \
          gcc g++ make \
          libssl-dev libncurses5-dev \
          qemu-user-static \
          debootstrap \
          device-tree-compiler \
          python3
        sudo update-binfmts --enable

    - name: Build Armbian Image
      run: |
        export LC_ALL=C
        export LANG=C
        export DEBIAN_FRONTEND=noninteractive
        
        ./compile.sh \
        BOARD=vontar-h618 \
        BRANCH=current \
        RELEASE=bookworm \
        BUILD_MINIMAL=yes \
        BUILD_DESKTOP=no \
        KERNEL_CONFIGURE=no \
        USE_DOCKER=no \
        SKIP_CONTAINER=yes \
        BUILD_CONTAINER=no

    - name: Upload kernel debs
      if: always()   # 即使前一步失败也执行
      uses: actions/upload-artifact@v4
      with:
        name: h618-kernel-debs
        path: |
          output/packages-hashed/global/linux-image-current-sunxi64_*.deb
          output/packages-hashed/global/linux-dtb-current-sunxi64_*.deb
          output/packages-hashed/global/linux-headers-current-sunxi64_*.deb

    - name: Upload image
      uses: actions/upload-artifact@v4
      with:
        name: armbian-h618
        path: output/images/*
